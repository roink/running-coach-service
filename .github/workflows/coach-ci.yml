name: Coach image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '25 0 1 * *'
permissions:
  contents: read
concurrency:
  group: coach-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Lint generic source and release tooling
        run: |
          python -m pip install ruff==0.17.3
          ruff check
          ruff format --check
      - name: Resolve, build and test without credentials or NAS access
        run: python scripts/ci_build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: coach-release
          path: |
            dist/coach-release.json
            dist/coach-image.tar.gz
            dist/coach-source.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    needs: build
    if: github.repository == 'roink/running-coach-service' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # This fresh job never installs dependencies or executes the image/source.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coach-release
          path: release
      - name: Publish immutable public downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          gh release create "coach-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            release/coach-release.json release/coach-image.tar.gz release/coach-source.tar.gz \
            --target "$REVISION" --prerelease --latest=false \
            --title "Coach build $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --notes 'Generic service image and source only. NAS checks successful CI provenance before local guarded deployment.'
